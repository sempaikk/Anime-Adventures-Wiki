name: Verify wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiki-checks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Cloudflare currently installs with npm 10, whose prerelease override
      # resolution differs from npm 11 shipped with newer Node 24 releases.
      - name: Check Cloudflare npm compatibility
        run: npx --yes --package=npm@10.9.2 npm ci --dry-run --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: node scripts/audit_site.mjs
      - run: npx wrangler deploy --dry-run
